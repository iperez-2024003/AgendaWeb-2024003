<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro | Perfil</title>
    <link rel="stylesheet" href="../Styles/contactos.css">
</head>
<body>
    <aside class="header-actions">
        <div class="sidebar-brand">
            <span class="brand-title">Agenda Pro</span>
            <span class="brand-subtitle">Gestión inteligente de contactos</span>
        </div>
        <a href="contactos.html" class="nav-link btn-home">📒 Contactos</a>
        <a href="nuevocontacto.html" class="nav-link btn-add">➕ Nuevo contacto</a>
        <a href="favoritos.html" class="nav-link btn-fav">⭐ Favoritos</a>

    <div class="container perfil-container">
        <div class="card perfil-card">
            <div class="tools">
                <div class="circle"><span class="red box"></span></div>
                <div class="circle"><span class="yellow box"></span></div>
                <div class="circle"><span class="green box"></span></div>

            <div class="card__content perfil-content">
                <div class="perfil-header-section">
                    <img src="/Images/Iverson.jpg" alt="Iverson Maldonado" class="perfil-foto">
                    <div class="perfil-stats">
                        <div class="stat-item">
                            <span class="stat-number">5</span>
                            <span class="stat-label">Contactos</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">2</span>
                            <span class="stat-label">Favoritos</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">3</span>
                            <span class="stat-label">Grupos</span>
                        </div>
                    </div>
                </div>

                <div class="perfil-user-info">
                    <h2 class="perfil-nombre">Iverson Maldonado</h2>
                    <p class="perfil-username">@imaldonado2024003</p>
                </div>

                
                <div class="perfil-bio">
                    <p>Estudiante / Administrador</p>
                    <p>imaldonado-2024003@kinal.edu.gt</p>
                    <p>Carnet: 2024003</p>
                </div>

                
                <div class="perfil-actions">
                    <a href="contactos.html" class="btn-view">Ver Contactos</a>
                </div>
            </div>
        </div>
    </div>
