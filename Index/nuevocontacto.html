<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto - Agenda Web</title>
    <link rel="stylesheet" href="../Styles/login.css">
    <link rel="stylesheet" href="../Styles/contactos.css">
</head>
<body>
    <div class="form-container" style="height: 100vh;">
        <div class="card" style="width: 400px;">
            <div class="tools">
                <div class="circle"><span class="red box"></span></div>
                <div class="circle"><span class="yellow box"></span></div>
                <div class="circle"><span class="green box"></span></div>
                <span class="window-title">Nuevo Contacto</span>
            </div>

            <div class="card__content">
                <div class="login-box">
                    <form>
                        <div class="field">
                            <span class="icon">👤</span>
                            <input required type="text" class="input" placeholder="Nombre completo">
                        </div>

                        <div class="field">
                            <span class="icon">📞</span>
                            <input required type="tel" class="input" placeholder="Número de teléfono">
                        </div>

                        <div class="field">
                            <span class="icon">📧</span>
                            <input required type="email" class="input" placeholder="Correo electrónico">
                        </div>

                        <button type="button" class="button" onclick="window.location.href='contactos.html'">GUARDAR CONTACTO</button>

                        <div class="sign-up">
                            <a href="contactos.html" style="color: #e74c3c;">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
