<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Contacto - Agenda Pro Iver</title>
    <link rel="stylesheet" href="../Styles/contactos.css">
</head>
<body>
    <div class="container nuevo-contacto-container">
        <header class="nuevo-contacto-header">
            <h1> Agregar Nuevo Contacto</h1>
        </header>

        <div class="card nuevo-contacto-card">
            <div class="tools">
                <div class="circle"><span class="red box"></span></div>
                <div class="circle"><span class="yellow box"></span></div>
                <div class="circle"><span class="green box"></span></div>
                <span class="window-title">Nuevo Registro</span>
            </div>
            <div class="card__content">
                <form class="form-nuevo-contacto">
                    <div class="form-group">
                        <label for="nombreContacto" class="form-label">👤 Nombre Completo</label>
                        <input type="text" id="nombreContacto" class="form-input" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="telefonoContacto" class="form-label">📞 Teléfono</label>
                        <input type="tel" id="telefonoContacto" class="form-input" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="correoContacto" class="form-label">✉️ Correo Electrónico</label>
                        <input type="email" id="correoContacto" class="form-input" placeholder="" required>
                    </div>

                    <div class="form-group">
                        <label for="direccionContacto" class="form-label">📍 Dirección</label>
                        <input type="text" id="direccionContacto" class="form-input" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="categoriaContacto" class="form-label">🏷️ Categoría</label>
                        <select id="categoriaContacto" class="form-input">
                            <option value="Trabajo">Trabajo</option>
                            <option value="Personal">Personal</option>
                            <option value="Familia">Familia</option>
                            <option value="Amigos">Amigos</option>
                        </select>
                    </div>

                    <div class="form-buttons">
                        <a href="contactos.html" class="btn-view"> Guardar Contacto</a>
                        <a href="contactos.html" class="btn-view btn-view-gray">← Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
