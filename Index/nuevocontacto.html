<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto - Agenda Web</title>
    <link rel="stylesheet" href="../Styles/login.css"> </head>
<body>
    <div class="login-card"> <form>
            <h2>Agregar Contacto</h2>
            <div class="input-group">
                <input type="text" placeholder="Nombre completo" required>
            </div>
            <div class="input-group">
                <input type="tel" placeholder="Número de teléfono" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Correo electrónico" required>
            </div>
            <button type="button" onclick="window.location.href='contactos.html'">Guardar Contacto</button>
            <br><br>
            <a href="contactos.html" style="text-decoration: none; color: #3498db;">Cancelar</a>
        </form>
    </div>
</body>
</html>
