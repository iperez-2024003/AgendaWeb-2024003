<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto - Agenda Web</title>
    <link rel="stylesheet" href="../Styles/login.css">
</head>
<body>
    <div class="form-container">
        <div class="card">
            <div class="tools">
                <div class="circle"><span class="red box"></span></div>
                <div class="circle"><span class="yellow box"></span></div>
                <div class="circle"><span class="green box"></span></div>
                <span class="window-title">Agregar Nuevo Contacto</span>
            </div>
            <div class="card__content">
                <div class="login-box">
                    <form>
                        <div class="field">
                            <span class="icon">👤</span>
                            <input required type="text" class="input">
                            <label class="label">Nombre completo</label>
                        </div>
                        <div class="field">
                            <span class="icon">📞</span>
                            <input required type="tel" class="input">
                            <label class="label">Teléfono</label>
                        </div>
                        <button type="button" class="button" onclick="window.location.href='contactos.html'">GUARDAR</button>
                        <div class="sign-up">
                            <a href="contactos.html">Volver atrás</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
